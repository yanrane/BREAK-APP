<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>BREAK</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: #111; background: #fff; }
      .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; }
      .logo { font-weight: 800; font-size: 16px; color: #16a34a; }
      .section { padding: 16px; }
      .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
      .big-time { font-size: 28px; font-weight: 700; color: #111; }
      .limit-label { font-size: 12px; color: #9ca3af; margin-top: 2px; }
      .bar-track { height: 8px; background: #e5e7eb; border-radius: 999px; margin: 12px 0; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }
      .domain-list { list-style: none; max-height: 140px; overflow-y: auto; }
      .input-group { margin-bottom: 10px; }
      .input-group label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
      input[type="email"], input[type="password"] { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; outline: none; }
      input:focus { border-color: #16a34a; box-shadow: 0 0 0 2px #dcfce7; }
      .btn { width: 100%; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
      .btn-primary { background: #16a34a; color: #fff; }
      .btn-primary:hover { background: #15803d; }
      .btn-outline { background: transparent; border: 1px solid #d1d5db; color: #374151; margin-top: 6px; }
      .btn-outline:hover { background: #f9fafb; }
      .btn-sm { font-size: 12px; padding: 6px 10px; width: auto; }
      .error { color: #ef4444; font-size: 12px; margin-top: 6px; }
      .hidden { display: none !important; }
      .flex { display: flex; }
      .gap-2 { gap: 8px; }
      .footer { padding: 10px 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 6px; }
      .text-gray { color: #6b7280; }
      .text-xs { font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="logo">BREAK</span>
      <span class="text-xs text-gray">Screen Monitor</span>
    </div>

    <!-- Login view -->
    <div id="view-login" class="section">
      <p style="font-size:13px;color:#6b7280;margin-bottom:14px;">Masuk untuk mulai tracking waktu media sosial kamu.</p>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <p id="login-error" class="error hidden"></p>
      <button id="login-btn" class="btn btn-primary">Masuk</button>
    </div>

    <!-- Dashboard view -->
    <div id="view-dashboard" class="section hidden">
      <div class="label">Penggunaan hari ini</div>
      <div id="total-time" class="big-time">0 mnt</div>
      <div id="limit-label" class="limit-label">dari batas 60 mnt</div>
      <div class="bar-track">
        <div id="usage-bar" class="bar-fill bg-green-500" style="width:0%"></div>
      </div>
      <ul id="domain-list" class="domain-list"></ul>
    </div>

    <!-- Dashboard footer -->
    <div id="view-footer" class="footer hidden">
      <button id="open-missions" class="btn btn-primary btn-sm">Misi Hari Ini</button>
      <button id="open-dashboard" class="btn btn-outline btn-sm">Dashboard</button>
      <button id="logout-btn" class="btn btn-outline btn-sm" style="margin-left:auto">Keluar</button>
    </div>

    <script src="../dist/popup.js" type="module"></script>
  </body>
</html>
